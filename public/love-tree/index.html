<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Heart Tree V6.1 | Ultimate Polish — Fairy × Cinema</title>
<style>
  :root{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#594452;background:transparent}
  *{box-sizing:border-box}
  html{background-color:transparent;color-scheme:normal}
  body{margin:0;min-height:0;display:block;padding:0;overflow:hidden;color:#594452;background-color:transparent;transition:color .9s ease}
  body.night{color:#ffe6f5;background-color:transparent}
  .tree-shell{width:min(1030px,100%);position:relative;z-index:1}
  .tree-frame{position:relative;isolation:isolate;overflow:hidden;background:#e7f1f6;border:1px solid rgba(255,255,255,.95);border-radius:30px;box-shadow:0 22px 75px rgba(94,112,150,.14);transition:background .85s ease,box-shadow .8s ease,border-color .8s ease}
  body.night .tree-frame{border-color:rgba(255,176,237,.28);box-shadow:0 25px 95px rgba(7,3,30,.65),0 0 55px rgba(217,55,157,.12)}
  canvas{display:block;width:100%;height:auto;aspect-ratio:960/700;touch-action:pan-y;cursor:crosshair}
  .topline{pointer-events:none;position:absolute;top:18px;left:24px;right:24px;display:flex;justify-content:space-between;gap:16px;align-items:center;z-index:2;font:600 10px/1.5 ui-monospace,monospace;letter-spacing:1.7px;color:#936076;text-shadow:0 1px rgba(255,255,255,.75)}
  .topline .counter{font-weight:400;opacity:.72}
  body.night .topline{color:#ffb9e4}
  .subline{pointer-events:none;position:absolute;left:28px;bottom:28px;z-index:2;display:flex;flex-direction:column;gap:8px}
  .subline .chapter{font:700 12px ui-monospace,monospace;letter-spacing:2px;color:#b24f77;text-shadow:0 2px 10px #ffffffcc}
  .subline .hint{font:500 11px ui-monospace,monospace;letter-spacing:1px;color:#926f84}
  body.night .subline .chapter{color:#ffd0e8;text-shadow:0 0 12px #f69bd8a8}
  body.night .subline .hint{color:#cba9cc}
  .progress-track{position:absolute;left:0;right:0;bottom:0;height:4px;z-index:5;background:rgba(244,145,181,.14)}
  .progress-fill{width:0;height:100%;background:linear-gradient(90deg,#ffbc6d,#ff669e,#d47dff);box-shadow:0 0 14px #f76ca9;transition:width .08s linear}
  .controls{display:grid;grid-template-columns:1.2fr 1.35fr 1.2fr;align-items:stretch;gap:clamp(7px,1vw,12px);margin:18px auto 0}
  .controls button{min-width:0;white-space:nowrap;padding-inline:clamp(8px,1.2vw,17px);font-size:clamp(10px,1vw,13px)}
  .controls .water-button{padding-left:8px}
  .controls .water-icon{width:clamp(22px,3vw,38px);height:clamp(22px,3vw,38px)}
  button{appearance:none;cursor:pointer;font:700 11px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.3px;transition:transform .2s,box-shadow .75s ease,background .75s ease,color .75s ease,border-color .75s ease;min-height:49px}
  button:focus-visible{outline:3px solid #ec679b;outline-offset:4px}
  button:hover{transform:translateY(-3px)}button:active{transform:translateY(1px)}
  .water-button{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:7px 20px 7px 9px;border:1px solid #f5c1cf;border-radius:60px;background:#fffdfa;color:#be577c;box-shadow:4px 5px 0 rgba(94,49,78,.09)}
  .water-icon{width:38px;height:38px;flex:none;transition:transform .5s cubic-bezier(.16,1,.3,1)}
  .water-button.watering .water-icon{transform:rotate(-27deg)}
  .button-label{display:flex;flex-direction:column;align-items:start;gap:3px;font-size:12px}.button-label span{font-size:10px;color:#a391a2}
  .effect-button{border-radius:50px;padding:12px 17px;border:1px solid rgba(214,96,145,.21);background:#fffcfa;color:#bd547a;box-shadow:4px 5px 0 rgba(94,49,78,.07)}
  .effect-button.strong{color:white;border-color:#fd628f;background:linear-gradient(110deg,#ff965e,#fb4d91 60%,#bd62ce);box-shadow:0 6px 22px rgba(246,72,144,.27)}
  body.night .effect-button,body.night .water-button{background:#372442;color:#ffe3f5;border-color:#664565;box-shadow:4px 5px 0 rgba(0,0,0,.2)}
  body.night .effect-button.strong{background:linear-gradient(105deg,#f86b68,#ed468f,#9751dc);border-color:#f77cb5;box-shadow:0 7px 26px #e7528a55}
  body.night .button-label span{color:#d7afca}
  .water-button{animation:water-invitation 2.8s ease-in-out infinite;position:relative}
  .effect-button.strong{background-size:180% 180%}
  .effect-button.strong{animation:magic-invitation 4.2s ease-in-out infinite}
  .water-button:hover,.effect-button.strong:hover{animation-play-state:paused;box-shadow:0 0 0 4px #ff8fbd33,0 8px 28px #f757bb44}
  @keyframes water-invitation{0%,100%{transform:translateY(0);box-shadow:4px 5px 0 rgba(94,49,78,.09),0 0 0 0 #ff8fbd00}50%{transform:translateY(-2px);box-shadow:4px 7px 0 rgba(94,49,78,.07),0 0 0 6px #ff8fbd12}}
  @keyframes magic-invitation{0%,100%{filter:saturate(1);box-shadow:0 7px 24px #ff63ab35,inset 0 1px #ffffff88}50%{filter:saturate(1.18);box-shadow:0 8px 34px #ff63ab68,inset 0 1px #ffffffaa}}
  .footnote{text-align:center;color:#b58da5;margin:15px auto 0;font:500 11px/1.7 ui-monospace,Consolas,monospace;min-height:19px;letter-spacing:.2px}
  body.night .footnote{color:#cba9d5}
  @media(max-width:520px){body{padding:9px}.tree-frame{border-radius:18px}.topline{top:11px;left:13px;right:13px;font-size:8px;letter-spacing:.9px}.subline{bottom:14px;left:14px;gap:5px}.subline .chapter{font-size:9px;letter-spacing:.7px}.subline .hint{display:none}.controls{gap:8px;margin-top:16px}.water-button,.effect-button{min-height:42px;font-size:10px;padding:9px 12px}.water-icon{width:30px;height:30px}.button-label span{font-size:8px}.button-label strong{font-size:10px}.footnote{font-size:9px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
  .tree-frame{background:#e8eef3;transform:translateZ(0)}
  .topline{font-size:10px;letter-spacing:1.85px}
  .subline .chapter{transition:opacity .45s ease;letter-spacing:2.2px}
  .effect-button.strong{background:linear-gradient(110deg,#ffb160,#fa5d97 48%,#ad68d5)}
  .controls{gap:9px}
  @media(max-width:520px){.topline{font-size:8px}.subline .chapter{letter-spacing:.6px}.effect-button.strong{font-size:9px}}
  @media(max-width:520px){body{padding:0}.controls{gap:6px;margin-top:12px}.controls button{min-height:42px;font-size:clamp(9px,2.6vw,11px);padding:6px 5px;letter-spacing:0}.controls .water-button{gap:4px;padding-left:4px}.controls .water-icon{width:23px;height:23px}.controls .button-label span{display:none}.controls .button-label strong{font-size:clamp(9px,2.7vw,11px)}.footnote{margin-top:9px;min-height:0}}


  /* V6.1: premium pearlescent chrome frame, deliberately restrained so the tree shines. */
  .tree-frame::before{content:none}
  .effect-button.strong{background:linear-gradient(105deg,#ffb55b,#ff619d 47%,#a65eff);border-color:#ff92c8;box-shadow:0 7px 30px #ff63ab50,inset 0 1px #ffffff88}
  body.night .effect-button.strong{background:linear-gradient(105deg,#ffab5e,#fb539d 48%,#a86cf1);border-color:#ff87cb;box-shadow:0 6px 32px #f757bb55}
  .tree-frame{box-shadow:0 28px 100px rgba(70,89,128,.17)}
  body.night .tree-frame{box-shadow:0 25px 95px rgba(7,3,30,.65),0 0 55px rgba(217,55,157,.12)}
  body.night .tree-frame{background:#111022}
  .theme-snapshot{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:1;transition:opacity .85s cubic-bezier(.22,.61,.36,1)}
  .theme-snapshot.fade-out{opacity:0}
  html.embed-stage .controls,html.embed-stage .footnote{display:none}
</style>
<script>if(new URLSearchParams(location.search).get('embed')==='stage')document.documentElement.classList.add('embed-stage');</script>

<body>
<main class="tree-shell" aria-label="Cây trái tim điện ảnh tương tác">
  <section class="tree-frame">
    <div class="topline"><span>✦ CÂY TRÁI TIM <span id="modeName" style="opacity:.55">/ GOLDEN MORNING</span></span><span class="counter">V6.1 &nbsp;·&nbsp; 1 / 1</span></div>
    <canvas id="stage" width="960" height="700" role="img" aria-label="Cây trái tim hoạt hình với trái tim nở từ dưới lên trong nắng ban mai, có thể chuyển sang đêm cổ tích rực sáng."></canvas>
    <div class="subline" aria-live="off"><span class="chapter" id="chapter">CHƯƠNG I · MỘT ĐIỀU ƯỚC</span><span class="hint" id="sceneHint">mỗi trái tim đều có một phép màu ♡</span></div>
    <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>
  </section>
  <div class="controls">
    <button type="button" class="water-button" id="water" aria-label="Xem lại hành trình cây nở từ đầu">
      <svg class="water-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M11 9h21c5 0 7 4 6 9l-5 23a6 6 0 0 1-6 5H13a7 7 0 0 1-7-7V16a7 7 0 0 1 5-7Z" fill="#A0DDF3" stroke="#48546D" stroke-width="2"/><path d="M28 13c6-8 13-6 13 0v6" stroke="#48546D" stroke-width="2.5" stroke-linecap="round"/><path d="M7 12c7-4 17-4 27-2" stroke="#689BB4" stroke-width="1.5" opacity=".8"/></svg>
      <span class="button-label"><span>ĐÁNH THỨC CÂY</span><strong id="wateringLabel">TƯỚI NƯỚC ♡</strong></span>
    </button>
    <button type="button" class="effect-button strong" id="love" aria-label="Bắt đầu màn trình diễn ánh sáng">✧ &nbsp; DIỆU KỲ</button>
    <button type="button" class="effect-button" id="mode" aria-pressed="false" aria-label="Bật đêm cổ tích">☾ &nbsp; ĐÊM CỔ TÍCH</button>
  </div>
  <p class="footnote" id="caption">Một khu vườn biết thở · Di chuột qua tán, chạm hoặc giữ để thả điều ước ✧</p>
</main>
<script>
(()=>{'use strict';
  const canvas=document.getElementById('stage');const ctx=canvas.getContext('2d',{alpha:false});const treeFrame=document.querySelector('.tree-frame');
  const button=document.getElementById('water'),label=document.getElementById('wateringLabel'),caption=document.getElementById('caption');
  const loveButton=document.getElementById('love'),modeButton=document.getElementById('mode'),chapter=document.getElementById('chapter'),sceneHint=document.getElementById('sceneHint'),progressBar=document.getElementById('progress');
  let night=new URLSearchParams(window.location.search).get('theme')==='night', sceneFlash=0, glitters=[], clickWaves=[], fallingStars=[],heartRain=[],comets=[],climaxAt=-100,climaxFired=false,chapterIndex=-1;
  const W=960,H=700,G=690;
  const V6_DURATION=18, STORY_SPEED=13.3/V6_DURATION;
  let pixelRatio=1,elapsed=0,last=0,startedAt=0,raf=0,wind=0,mouseX=0,mouseY=0;
  let renderQuality=1,drawTimeMean=0,slowFrames=0,fastFrames=0;
  let pointerDownAt=-1,pointerDownX=480,pointerDownY=350;
  let smoothMouseX=0,smoothMouseY=0,pendingClimax=false;

  let running=false, seeded=false, burst=[],drifters=[];const motionLess=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let pendingTheme=null;
  const commitTheme=(value,notify)=>{night=value;document.body.classList.toggle('night',night);modeButton.setAttribute('aria-pressed',String(night));modeButton.innerHTML=night?'☀ &nbsp; NẮNG BAN MAI':'☾ &nbsp; ĐÊM CỔ TÍCH';canvas.setAttribute('aria-label',night?'Cây trái tim nhiều màu tỏa sáng giữa đêm cổ tích.':'Cây trái tim nở rực rỡ trong nắng ban mai, những hạt phấn sáng lấp lánh.');document.getElementById('modeName').textContent=night?'/ FAIRY NIGHT':'/ GOLDEN MORNING';modeButton.setAttribute('aria-label',night?'Bật nắng ban mai':'Bật đêm cổ tích');caption.textContent=night?'Đêm xuống, những điều ước tỏa sáng lấp lánh ✨':'Nắng ban mai dịu ngọt — mỗi cánh tim là một sắc hoa ✦';if(notify)window.parent.postMessage({type:'heart-tree-theme',night},window.location.origin);};
  const applyTheme=(nextNight,notify=false)=>{const targetNight=Boolean(nextNight);if(pendingTheme!==null)return;if(targetNight===night||motionLess){commitTheme(targetNight,notify);return;}const snapshot=document.createElement('canvas');snapshot.className='theme-snapshot';snapshot.width=canvas.width;snapshot.height=canvas.height;const snapshotContext=snapshot.getContext('2d');if(!snapshotContext){commitTheme(targetNight,notify);return;}snapshotContext.drawImage(canvas,0,0);treeFrame.append(snapshot);pendingTheme=targetNight;modeButton.disabled=true;commitTheme(targetNight,notify);requestAnimationFrame(()=>snapshot.classList.add('fade-out'));setTimeout(()=>{snapshot.remove();pendingTheme=null;modeButton.disabled=false;},860);};
  if(night)applyTheme(true);
  window.addEventListener('message',event=>{if(event.origin!==window.location.origin)return;const data=event.data;if(data?.type==='heart-tree-parent-theme'){if(pendingTheme===null)applyTheme(data.night);return;}if(data?.type!=='heart-tree-action')return;if(data.action==='water')button.click();if(data.action==='magic')loveButton.click();if(data.action==='mode')modeButton.click();});
  const reportHeight=()=>{const target=document.documentElement.classList.contains('embed-stage')?treeFrame:document.querySelector('.tree-shell');window.parent.postMessage({type:'heart-tree-height',height:Math.ceil(target.getBoundingClientRect().height)},window.location.origin);};
  new ResizeObserver(reportHeight).observe(document.querySelector('.tree-shell'));
  window.addEventListener('load',reportHeight);
  const PALETTE=['#ffab25','#ffde5b','#ff7046','#ff8346','#ff284e','#ff087b','#e900b3','#fa49b2','#ff8cb9','#ffc2df','#ff738e','#ffd1a6','#fff185','#ff405c','#fa008d','#ff4fa0','#ff9c23','#ffb8cc','#ffa352','#ef43ec'];
  function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const rand=mulberry32(513249);
  const r=(a,b)=>a+(b-a)*rand();const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n));
  const easeOutCubic=t=>1-Math.pow(1-clamp(t),3);const easeOutBack=t=>{t=clamp(t);return 1+2.5*Math.pow(t-1,3)+1.5*Math.pow(t-1,2)};
  // V6.1: Hand-painted translucent glass-petal sprites, baked ONCE. Rendering
  // individual hearts is still just drawImage: gradients never run per leaf.
  function makeSprite(color){
    const base=[parseInt(color.slice(1,3),16),parseInt(color.slice(3,5),16),parseInt(color.slice(5,7),16)];
    const rgba=(light,alpha=1)=>'rgba('+base.map(v=>Math.round(v+(light>0?(255-v):v)*light)).join(',')+','+alpha+')';
    const c=document.createElement('canvas');c.width=c.height=64;
    const k=c.getContext('2d');k.translate(32,33);
    const shape=()=>{k.beginPath();k.moveTo(0,18);k.bezierCurveTo(-8,12,-24,3,-24,-11);k.bezierCurveTo(-24,-28,-7,-29,0,-17);k.bezierCurveTo(8,-29,24,-26,24,-10);k.bezierCurveTo(23,4,9,13,0,18);k.closePath();};
    k.save();k.shadowColor='rgba(73,25,51,.24)';k.shadowBlur=4.3;k.shadowOffsetY=2.1;shape();k.fillStyle=color;k.fill();k.restore();
    k.save();shape();k.clip();
    const shade=k.createLinearGradient(-21,-24,20,20);
    shade.addColorStop(0,rgba(.39));shade.addColorStop(.34,rgba(.14));
    shade.addColorStop(.67,color);shade.addColorStop(1,rgba(-.23));
    k.fillStyle=shade;k.fillRect(-27,-29,55,52);
    const translucency=k.createRadialGradient(-11,-17,0,-7,-8,32);
    translucency.addColorStop(0,'rgba(255,250,245,.27)');
    translucency.addColorStop(.43,'rgba(255,230,237,.085)');
    translucency.addColorStop(1,'rgba(55,0,54,.07)');
    k.fillStyle=translucency;k.fillRect(-27,-29,55,52);
    // Soft pearly rim and crease, no neon or thick white border.
    k.lineCap='round';k.lineWidth=1.45;k.strokeStyle='rgba(255,250,248,.26)';
    k.beginPath();k.moveTo(-21,-11);k.bezierCurveTo(-23,-23,-9,-26,-2,-18);k.stroke();
    k.lineWidth=1;k.strokeStyle='rgba(91,27,69,.11)';
    k.beginPath();k.moveTo(.5,-13);k.quadraticCurveTo(-1,-6,0,2);k.stroke();
    k.fillStyle='rgba(255,255,255,.26)';k.beginPath();k.ellipse(-12,-15,5.8,2.7,-.65,0,Math.PI*2);k.fill();
    k.fillStyle='rgba(255,251,244,.16)';k.beginPath();k.ellipse(11,-17,3.8,1.7,.6,0,Math.PI*2);k.fill();
    k.restore();return c;
  }
    const sprites=PALETTE.map(makeSprite);
  const SPRITE_STEPS=24,SPRITE_EDGE=74;
  const spriteIndex=new Map(sprites.map((sprite,i)=>[sprite,i]));
  const rotatedSprites=sprites.map(sprite=>Array.from({length:SPRITE_STEPS},(_,i)=>{
    const c=document.createElement('canvas');c.width=c.height=SPRITE_EDGE;
    const k=c.getContext('2d');k.translate(SPRITE_EDGE/2,SPRITE_EDGE/2);
    k.rotate(i*2*Math.PI/SPRITE_STEPS);k.drawImage(sprite,-32,-32);return c;
  }));
  function insideHeart(nx,ny){return Math.pow(nx*nx+ny*ny-1,3)-nx*nx*ny*ny*ny<-.001;}
  const leaves=[];
  for(let i=0;i<1640;i++){
    let x,y,nx,ny,tries=0;
    do{nx=r(-1.18,1.18);ny=r(-1.1,1.22);tries++;}while(!insideHeart(nx,ny)&&tries<300);
    // Organic heart-shaped canopy with bright colored heart blossoms on several layers.
    x=480+nx*279+r(-7,7);y=350-ny*221+r(-7,7);
    let depth=r(0,1),sz=r(15,26)*(.74+.39*depth);
    // A petal cohort hears the same breeze with a delayed response.
    const windCell=Math.floor((x-180)/92)+Math.floor((y-125)/105)*5;
    // V5: the bloom front climbs from the lower branches to the crown (V3's organic order).
    // Small stagger and clustering makes it feel like living blossoms rather than a hard wipe.
    const altitude=clamp((557-y)/475);
    const cluster=(Math.sin(x*.032+Math.cos(y*.023)*2.1)+1)*.105;
    let delay=4.48+altitude*2.30+r(0,.56)+cluster+.12*Math.abs(nx);
    leaves.push({x,y,size:sz,color:Math.floor(r(0,sprites.length)),rotation:r(-Math.PI,Math.PI),phase:r(0,Math.PI*2),freq:r(.55,1.55),depth,delay,shape:rand()<.27?'petal':'heart',twinkle:rand()<.115,glow:rand()<.105,drift:r(.7,1.4),windCell,burst:r(0,1),zspin:r(-.4,.4)});
  }
  leaves.sort((a,b)=>a.depth-b.depth);
  function reset(){elapsed=0;last=performance.now();running=true;pendingClimax=false;seeded=false;burst=[];drifters=[];glitters=[];clickWaves=[];fallingStars=[];heartRain=[];comets=[];fountain.length=0;sceneFlash=0;climaxAt=-100;climaxFired=false;chapterIndex=-1;button.classList.add('watering');label.textContent='ĐANG NẢY MẦM';caption.textContent='Từng mầm sáng đang thức giấc từ gốc cây ✦';clearTimeout(button._wTimer);button._wTimer=setTimeout(()=>button.classList.remove('watering'),1350);}
  button.addEventListener('click',reset);
  function resize(){let box=canvas.getBoundingClientRect();pixelRatio=Math.min(devicePixelRatio||1,box.width<600?1.5:1.8);canvas.width=Math.round(box.width*pixelRatio);canvas.height=Math.round(box.height*pixelRatio);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);}
  new ResizeObserver(resize).observe(canvas);resize();
  canvas.addEventListener('pointermove',e=>{let p=canvas.getBoundingClientRect();mouseX=((e.clientX-p.left)/p.width-.5)*2;mouseY=((e.clientY-p.top)/p.height-.5)*2;},{passive:true});
  canvas.addEventListener('pointerleave',()=>{mouseX=0;mouseY=0;});
  function loveExplosion(x,y,count=55){
    if(elapsed*STORY_SPEED<3.6)return;
    clickWaves.push({x,y,age:0,life:.9});sceneFlash=.18;
    for(let j=0;j<count;j++){
      const angle=r(0,Math.PI*2),speed=r(55,220)*Math.sqrt(r(.1,1));
      burst.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-45,size:r(7,21),rot:r(-3,3),rv:r(-5,5),age:0,life:r(1.1,2.3),c:Math.floor(r(0,sprites.length))});
    }
    while(burst.length>250)burst.shift();
  }
  canvas.addEventListener('pointerdown',e=>{
    const b=canvas.getBoundingClientRect();pointerDownAt=performance.now();
    pointerDownX=(e.clientX-b.left)/b.width*W;
    pointerDownY=(e.clientY-b.top)/b.height*H;
  });
  canvas.addEventListener('pointerup',e=>{
    if(pointerDownAt<0)return;
    const held=performance.now()-pointerDownAt;pointerDownAt=-1;
    if(held>450&&elapsed*STORY_SPEED>4.5){
      loveExplosion(pointerDownX,pointerDownY,Math.min(82,38+Math.floor(held/33)));
      caption.textContent='Một điều ước vừa được gửi theo gió ♡';
    }else loveExplosion(pointerDownX,pointerDownY,36);
  });
  canvas.addEventListener('pointercancel',()=>pointerDownAt=-1);

  loveButton.addEventListener('click',()=>{
    if(elapsed*STORY_SPEED<8.8){
      // Never jump forward in time: doing so makes the whole tree visibly pop.
      pendingClimax=true;caption.textContent='Cây đang gom ánh sáng, chờ hoa nở trọn vẹn ♡';
      return;
    }
    climaxFired=true;triggerClimax(true);

    speed:.42+(i%5)*.08,size:7+(i%4)*1.9,color:(i*7)%sprites.length
  }));
  function drawDreamWishes(t){
    if(t<8.4||motionLess)return;
    const fade=smoothGrow((t-8.4)/1.3);
    for(let i=0;i<dreamWishes.length;i++){
      if(renderQuality===0&&i%2===0)continue;
      const f=dreamWishes[i];const orbit=t*f.speed+f.phase;
      const x=f.sx+Math.sin(orbit)*23+smoothMouseX*4;
      const y=f.sy-((t-8)*3.9)%52+Math.cos(orbit*1.2)*9;
      const a=fade*(night?.61:.43)*(.62+.38*Math.sin(t+f.phase)**2);
      drawSprite(sprites[f.color],x,y,f.size,.28*Math.sin(orbit),a);
    }
  }
  // Symphonic waves animate light on each blossom, travelling from root to crown.
  // Instead of circular shockwaves, energy climbs upward in feather-soft phrases.
  const sonataNotes=[];
  for(let i=0;i<245;i++){
    let l=leaves[Math.floor(frng()*leaves.length)];
    sonataNotes.push({x:l.x,y:l.y,depth:l.depth,phase:frng()*6.283,
      altitude:clamp((558-l.y)/475),size:1+frng()*2.6,gold:frng()>.43});
  }
  function drawSymphony(t){
    const automatic=Math.exp(-Math.pow((t-9.5)/1.75,4));
    const manual=climaxAt>0?Math.exp(-Math.pow((t-climaxAt-1.0)/1.65,4)):0;
    const intensity=Math.max(automatic,manual);
    if(intensity<.014)return;
    for(let i=0;i<sonataNotes.length;i++){
      if(renderQuality===0&&i%2===0)continue;
      const p=sonataNotes[i];
      const front=t-8.42-p.altitude*1.23;
      const wave=Math.exp(-Math.pow(front/.36,2));
      const replay=climaxAt>=0?Math.exp(-Math.pow((t-climaxAt-.25-p.altitude*1.05)/.33,2)):0;
      const twinkle=Math.pow(Math.max(0,Math.sin(t*1.9+p.phase)),10);
      const a=(.14*twinkle+Math.max(wave,replay)*.58)*intensity*(night?.82:.57);
      if(a<.065)continue;
      const x=p.x+Math.sin(t*.9+p.phase)*1.65,y=p.y+Math.cos(t*.8+p.phase)*1.6;
      drawGlow(p.gold?haloGold:haloPink,x,y,20+p.size*8,a*.25);
      drawStar(x,y,p.size*(.65+.3*a),a*.63,p.gold?'#fff4b6':'#fff4f9');
    }
  }
  // Keeps the resting tree gently moving for as long as the page is open.
  // Frame budget adapts only *nonessential* sparkles, not leaf geometry.
  function monitorQuality(milliseconds){
    drawTimeMean=drawTimeMean?drawTimeMean*.96+milliseconds*.04:milliseconds;
    if(drawTimeMean>22){slowFrames++;fastFrames=0;}
    else if(drawTimeMean<13){fastFrames++;slowFrames=0;}
    if(slowFrames>90){renderQuality=0;slowFrames=0;}
    if(fastFrames>230){renderQuality=1;fastFrames=0;}
  }

  function syncStatus(t){
    directionTitle(t);
    progressBar.style.width=(clamp(elapsed/V6_DURATION)*100).toFixed(2)+'%';
    if(t>12.45&&!seeded){seeded=true;label.textContent='XEM LẠI ♡';caption.textContent='Điều kỳ diệu vẫn tiếp diễn · giữ chuột vào tán để gửi điều ước ✧';}
  }
  function frame(now){
    const realDt=last?Math.max(0,(now-last)/1000):0;
    const dt=Math.min(realDt,.045);
    last=now;
    if(running)elapsed+=Math.min(realDt,.075);
    let t=elapsed*STORY_SPEED;
    if(motionLess&&running){t=13.3;elapsed=18;running=false;}
    wind=motionLess?0:(.36*Math.sin(t*.44)+.22*Math.sin(t*1.04+.8));
    const pointerEase=motionLess?1:1-Math.exp(-dt*8.5);
    smoothMouseX+=(mouseX-smoothMouseX)*pointerEase;
    smoothMouseY+=(mouseY-smoothMouseY)*pointerEase;
    const drawStart=performance.now();
    ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
    drawAtmosphere(t);
    drawAmbient(t);
    drawFireflies(t,false);
    drawLightCurtains(t);
    drawStageBeams(t);
    drawLightChoir(t);
    drawCanopyLuminance(t);
    drawSilkTrails(t);
    drawWood(t);
    drawEnergyTrails(t);
    drawDepthPockets(t);
    drawGrowthMagic(t);
    drawSeed(t);
    drawFoliage(t);
    drawPetalLuminescence(t);
    drawSymphony(t);
    drawPrismClusters(t);
    drawBloomSparks(t);
    drawTwinkles(t);
    drawMorningHighlights(t);
    drawMagicMotes(t);
    drawFireflies(t,true);
    drawDreamWishes(t);
    drawClimax(t,dt);
    drawWater(t);
    drawDrifters(dt,t);
    drawHeartRain(dt,t);
    drawBurst(dt);
    for(let i=clickWaves.length-1;i>=0;i--){clickWaves[i].age+=dt;if(clickWaves[i].age>=clickWaves[i].life)clickWaves.splice(i,1);}
    sceneFlash=Math.max(0,sceneFlash-dt*.73);
    if(sceneFlash>0){ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle=night?`rgba(255,121,215,${sceneFlash*.023})`:`rgba(255,217,170,${sceneFlash*.02})`;ctx.fillRect(0,0,W,H);ctx.restore();}
    ctx.globalAlpha=1; // Softly grounded trunk, never a sudden hard horizon line.
    ctx.fillStyle=night?'rgba(255,183,223,.05)':'rgba(255,214,193,.14)';ctx.fillRect(0,698,W,2);
    syncStatus(t);
    monitorQuality(performance.now()-drawStart);
    raf=requestAnimationFrame(frame);
  }
  // The first watering gesture starts the growth sequence; changing light never resets it.
  elapsed=0;last=performance.now();raf=requestAnimationFrame(frame);
  // Local dev/QA interface; no dependency on network or a framework.
  window.__heartTreeV61={seek(seconds){elapsed=Math.max(0,Number(seconds)||0);climaxFired=elapsed*STORY_SPEED>9;climaxAt=-100;burst=[];heartRain=[];comets=[];fountain.length=0;seeded=false;chapterIndex=-1;pendingClimax=false;},reset,burst(){loveButton.click();},get time(){return elapsed;},get quality(){return renderQuality;},get avgDrawMs(){return drawTimeMean;},get petalCount(){return leaves.length;}};
})();
